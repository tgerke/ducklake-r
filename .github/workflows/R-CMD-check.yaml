# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # A non-interactive duckdb session keeps extensions in a per-process
      # tempdir unless given a home; without this, the pre-installed extension
      # is invisible to the check's subprocesses and examples/vignettes
      # silently skip.
      DUCKDB_R_HOME: ~/.duckdb-ci

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Drop the Chrome apt source the runner image ships
        # Its index fails hash checks now and then, and setup-r's apt-get
        # update then fails before R is installed. CI never uses Chrome.
        if: runner.os == 'Linux'
        run: (grep -ls "dl.google.com" /etc/apt/sources.list.d/* || true) | xargs -r sudo rm -f

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install the ducklake DuckDB extension
        run: |
          con <- DBI::dbConnect(duckdb::duckdb())
          DBI::dbExecute(con, "INSTALL ducklake;")
          DBI::dbExecute(con, "LOAD ducklake;")
          print(DBI::dbGetQuery(con, "SELECT extension_name, installed, loaded, install_path FROM duckdb_extensions() WHERE extension_name = 'ducklake'"))
          cat("extension_directory:", DBI::dbGetQuery(con, "SELECT current_setting('extension_directory') AS d")$d, "\n")
          cat("HOME:", Sys.getenv("HOME"), "\n")
          DBI::dbDisconnect(con, shutdown = TRUE)
          # Fail loudly here rather than letting every example and vignette
          # silently self-skip and leave a green but empty check. A fresh
          # process is the real test: extension visibility must survive into
          # the check's subprocesses, not just this session.
          code <- 'g <- DBI::dbGetQuery(DBI::dbConnect(duckdb::duckdb()), "SELECT installed FROM duckdb_extensions() WHERE extension_name = \'ducklake\'"); quit(status = as.integer(!isTRUE(nrow(g) == 1 && g$installed[1])))'
          status <- system2(file.path(R.home("bin"), "Rscript"), c("-e", shQuote(code)))
          if (status != 0L) {
            stop("ducklake extension is not visible to a fresh R process; examples and vignettes would skip")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
