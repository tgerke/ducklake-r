# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    env:
      # duckdb >= 1.5.2 keeps extensions in a per-process tempdir unless given
      # a persistent home; without this, the pre-installed extension is invisible
      # to pkgdown's example and vignette subprocesses.
      DUCKDB_R_HOME: ~/.duckdb-ci
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install the ducklake DuckDB extension
        run: |
          con <- DBI::dbConnect(duckdb::duckdb())
          DBI::dbExecute(con, "INSTALL ducklake;")
          DBI::dbExecute(con, "LOAD ducklake;")
          print(DBI::dbGetQuery(con, "SELECT extension_name, installed, loaded, install_path FROM duckdb_extensions() WHERE extension_name = 'ducklake'"))
          cat("extension_directory:", DBI::dbGetQuery(con, "SELECT current_setting('extension_directory') AS d")$d, "\n")
          cat("HOME:", Sys.getenv("HOME"), "\n")
          DBI::dbDisconnect(con, shutdown = TRUE)
          # Fail loudly here rather than letting every example and vignette
          # silently self-skip and leave a green but empty check. A fresh
          # process is the real test: extension visibility must survive into
          # the check's subprocesses, not just this session.
          code <- 'g <- DBI::dbGetQuery(DBI::dbConnect(duckdb::duckdb()), "SELECT installed FROM duckdb_extensions() WHERE extension_name = \'ducklake\'"); quit(status = as.integer(!isTRUE(nrow(g) == 1 && g$installed[1])))'
          status <- system2(file.path(R.home("bin"), "Rscript"), c("-e", shQuote(code)))
          if (status != 0L) {
            stop("ducklake extension is not visible to a fresh R process; examples and vignettes would skip")
          }
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
