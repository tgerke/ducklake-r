# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Install the ducklake DuckDB extension
        run: |
          con <- DBI::dbConnect(duckdb::duckdb())
          DBI::dbExecute(con, "INSTALL ducklake;")
          DBI::dbExecute(con, "LOAD ducklake;")
          print(DBI::dbGetQuery(con, "SELECT extension_name, installed, loaded, install_path FROM duckdb_extensions() WHERE extension_name = 'ducklake'"))
          cat("extension_directory:", DBI::dbGetQuery(con, "SELECT current_setting('extension_directory') AS d")$d, "\n")
          cat("HOME:", Sys.getenv("HOME"), "\n")
          DBI::dbDisconnect(con, shutdown = TRUE)
          # Fail loudly here rather than letting every example and vignette
          # silently self-skip and leave a green but empty check.
          con2 <- DBI::dbConnect(duckdb::duckdb())
          got <- DBI::dbGetQuery(con2, "SELECT installed FROM duckdb_extensions() WHERE extension_name = 'ducklake'")
          DBI::dbDisconnect(con2, shutdown = TRUE)
          if (!isTRUE(nrow(got) == 1 && got$installed[1])) {
            stop("ducklake extension is not visible to a fresh process; examples and vignettes would skip")
          }
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
